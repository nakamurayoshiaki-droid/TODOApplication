<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>カテゴリ管理 - Todoアプリ</title>
	<link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>
	<div class="container-small">
		<!-- ヘッダー -->
		<header class="page-header">
			<h1>カテゴリ管理</h1>
			<a th:href="@{/tasks}" class="btn btn-secondary">タスク一覧へ戻る</a>
		</header>

		<!-- 保存成功・削除成功メッセージ -->
		<div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
		<!-- 保存失敗（重複など）メッセージ -->
		<div th:if="${errorMessage}" class="alert alert-error" th:text="${errorMessage}"></div>

		<!-- カテゴリ新規作成フォーム -->
		<main class="card">
			<h2 class="section-title">新規カテゴリ追加</h2>
			<form th:action="@{/categories}" th:object="${category}" method="post">
				<div class="form-group">
					<label for="name">カテゴリ名 <span class="required">*</span></label>
					<input type="text" id="name" th:field="*{name}" class="form-control" placeholder="例: 仕事"
						maxlength="20">
					<span class="error-msg" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></span>
				</div>

				<!-- ラベル色の入力欄（HTML5のcolor inputを使用） -->
				<div class="form-group">
					<label for="color">ラベル色</label>
					<input type="color" id="color" th:field="*{color}" class="form-control"
						style="max-width: 80px; padding: 4px;">
				</div>
				<div class="form-actions">
					<button type="submit" class="btn btn-primary">追加する</button>
				</div>
			</form>
		</main>

		<!-- カテゴリ一覧 -->
		<main class="card" style="margin-top: 20px;">
			<h2 class="section-title">カテゴリ一覧</h2>
			<div th:if="${#lists.isEmpty(categories)}" class="empty-state">
				<p>カテゴリは登録されていません</p>
			</div>
			<table th:unless="${#lists.isEmpty(categories)}" class="category-table">
				<thead>
					<tr>
						<th>カテゴリ名</th>
						<th class="col-action">操作</th>
					</tr>
				</thead>
				<tbody>
					<tr th:each="c : ${categories}">
						<td>
							<span class="category-badge"
								th:style="'background-color:' + ${c.color != null ? c.color : '#334155'}"
								th:text="${c.name}">カテゴリ名</span>
						</td>
						<td class="action-buttons">

							<!-- 削除ボタン -->
							<form th:action="@{/categories/{id}/delete(id=${c.id})}" method="post"
								onsubmit="return confirm('このカテゴリを削除しますか？（属するタスクは「カテゴリなし」になります）');">
								<button type="submit" class="btn btn-danger btn-sm">削除</button>
							</form>
						</td>
					</tr>
				</tbody>
			</table>
		</main>
	</div>
</body>

</html>
