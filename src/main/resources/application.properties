spring.application.name=todo-app
server.port=8080

# MySQL接続設定
# ユーザー名・パスワードは環境変数(DB_USERNAME / DB_PASSWORD)で上書き可能。
# 未設定の場合は開発用デフォルト値(root / root)を使用する。
# ※ 実際のパスワードをこのファイルに直書きしてGitにコミットしないこと。
spring.datasource.url=jdbc:mysql://localhost:3306/tododb?useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=UTF-8&serverTimezone=Asia/Tokyo
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}

# JPA / Hibernate設定（自動テーブル生成）
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect